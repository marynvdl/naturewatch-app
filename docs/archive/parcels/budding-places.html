<!DOCTYPE html>
<html lang="en">
<head>

<title>Sooty Earth · Budding Places · refined prototype</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{--ink:#33322f;--muted:#77766e;--soft:#aaa89e;--paper:#fff;--background:#f6f6f4;--line:#e9e9e4;--forest:#336557;--mint:#e4efe8;--sage:#f3f7f4;--shadow:0 16px 45px rgba(36,37,33,.1);--serif:Georgia,'Times New Roman',serif}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Arial,sans-serif;color:var(--ink);background:var(--background)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #779c8e;outline-offset:3px}a{color:inherit}
.app{height:100dvh;min-height:570px;display:grid;grid-template-columns:minmax(300px,365px) minmax(310px,408px) minmax(360px,1fr);overflow:hidden}
.results-panel,.place-panel{background:var(--paper);min-height:0;z-index:8;box-shadow:2px 0 15px rgba(30,40,33,.03);border-right:1px solid var(--line)}
.results-panel{display:flex;flex-direction:column;padding:24px 18px 15px;gap:17px}.results-head{display:flex;align-items:center;justify-content:space-between}.wordmark{font-family:var(--serif);font-size:29px;font-weight:400;letter-spacing:-1px;line-height:1.12}.wordmark em{color:#718a7e;font-weight:normal}.product-label{font-size:10px;text-transform:uppercase;letter-spacing:.15em;font-weight:650;color:#a19c90}
.icon-button{border:1px solid var(--line);background:#fff;width:37px;height:37px;display:grid;place-items:center;border-radius:11px;color:#5c5c57;font-size:17px}.icon-button:hover{background:#f5f6f3}
.searchbox{display:flex;align-items:center;gap:10px;border:1px solid #dedfd9;border-radius:12px;background:#fcfcfb;padding:11px 13px;color:#8b918a;min-height:45px}.searchbox input{min-width:0;flex:1;border:0;background:transparent;outline:0;font-size:13px;color:#4b4e48}.searchbox input::placeholder{color:#9da09a}.searchbox kbd{font:12px/1 monospace;color:#aeafa8}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:white;border:1px solid #e6e5e1;border-radius:10px;padding:9px 11px;color:#585953;white-space:nowrap;font-size:12px}.chip[aria-pressed="true"]{background:#3d3c39;color:#fff;border-color:#3d3c39}.chip:hover:not([aria-pressed="true"]){background:#f5f5f3}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:7px 2px 1px}.section-head h2{margin:0;font:400 24px/1.15 var(--serif);letter-spacing:-.5px}.section-head span{color:#96978e;font-size:11px}
.results-list{overflow-y:auto;flex:1;min-height:0;margin:0 -9px;padding:4px 9px 10px;scrollbar-width:thin}
.result{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid transparent;border-bottom:1px solid #eeeeea;padding:15px 9px;border-radius:10px;color:var(--ink);min-height:99px}.result:hover{background:#fafbf8}.result.selected{border:1px solid #aec9b8;background:#f2f7f3;box-shadow:inset 3px 0 var(--forest)}.result-name{font-size:14px;font-weight:640;line-height:1.4}.result-meta{font-size:12px;color:var(--muted);margin-top:3px}.result-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.quiet-tag{display:inline-block;color:#617166;background:#eff3ee;font-size:11px;border-radius:6px;padding:3px 6px}.result-photo{width:82px;height:69px;flex:0 0 82px;border-radius:9px;overflow:hidden;background:#e5e8df;object-fit:cover}.no-photo{display:grid;place-items:center;font-size:21px;color:#a1aaa0;background:linear-gradient(135deg,#f1f1e9,#dce4d9)}
.browse-footer{border-top:1px solid var(--line);padding:12px 3px 0;display:flex;justify-content:space-between;gap:8px;color:#95978e;font-size:11px}
.place-panel{display:flex;flex-direction:column;overflow:auto;scrollbar-width:thin;position:relative}.place-panel.is-empty{align-items:center;justify-content:center}.empty-placeholder{padding:30px;text-align:center;color:#98998f}.empty-placeholder .leaf{font-size:35px}.empty-placeholder h2{font:26px var(--serif);color:var(--ink);margin:12px 0 5px}.place-topline{display:flex;align-items:center;justify-content:space-between;padding:15px 18px 11px;color:#8b8d86;font-size:11px;letter-spacing:.05em;border-bottom:1px solid var(--line)}.close-detail{background:none;border:0;color:#858780;font-size:21px;line-height:1;padding:2px 5px}
.hero{position:relative;height:239px;min-height:239px;background:linear-gradient(140deg,#dde4d8,#c6d3c8);overflow:hidden}.hero-main{display:block;width:100%;height:100%;border:0;padding:0;background:none;cursor:zoom-in;position:relative;text-align:left}.hero-image{display:block;width:100%;height:100%;object-fit:cover}.hero-main.photo-load-failed::before{content:"Wikimedia photograph requires an internet connection";position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:#63796c;z-index:1;text-align:center;padding:20px}.hero-main::after{content:'';position:absolute;inset:50% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.37));pointer-events:none}.photo-empty{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(145deg,#e4e9e0,#c9d7cc);color:#698175;font:italic 19px var(--serif)}
.hero-caption{position:absolute;z-index:1;left:16px;bottom:11px;color:#fff;font-size:10px;text-shadow:0 1px 7px rgba(0,0,0,.65);pointer-events:none}.hero-count{position:absolute;right:14px;top:13px;color:white;background:rgba(32,32,32,.57);border-radius:40px;padding:5px 9px;font-size:11px;pointer-events:none}.hero-arrows{position:absolute;z-index:2;top:50%;transform:translateY(-50%);border:none;border-radius:100%;width:31px;height:31px;background:rgba(255,255,255,.9);color:#30332d;font-size:18px;display:grid;place-items:center}.hero-arrows.prev{left:12px}.hero-arrows.next{right:12px}.gallery-hint{position:absolute;z-index:1;bottom:12px;right:14px;color:white;font-size:10px;text-shadow:0 1px 5px #333;pointer-events:none}
.place-main{padding:21px 21px 25px}.eyebrow{font-size:10px;color:#8c8e84;letter-spacing:.1em;text-transform:uppercase;font-weight:680}.place-title{font:400 32px/1.1 var(--serif);margin:8px 0 9px;letter-spacing:-.6px}.subtitle{font-size:12px;color:#777b71}.area-tag{display:inline-flex;gap:8px;align-items:center;background:#dfece3;color:#225e49;padding:8px 12px;border-radius:9px;margin-top:16px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}.area-tag small{font-weight:500;font-size:11px;opacity:.8}
.detail-actions{display:flex;gap:8px;margin:17px 0 2px}.small-action{border:1px solid #e5e8e2;background:white;color:#5f6e61;padding:8px 12px;border-radius:9px;font-size:12px;display:flex;gap:6px;align-items:center}.small-action:hover{background:var(--sage)}.small-action.primary{background:#3b594d;color:#fff;border-color:#3b594d}
.tabbar{display:flex;gap:25px;border-bottom:1px solid var(--line);margin-top:24px}.tab{border:0;background:none;border-bottom:2px solid transparent;color:#8b8c85;padding:0 0 13px;font-size:13px}.tab[aria-selected="true"]{color:#304f44;border-bottom-color:#365d50;font-weight:650}.tab-content{padding-top:19px;font-size:13px;color:#66685f}.tab-content p{margin:0 0 16px;line-height:1.75}.section-label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:#a1a29a;font-weight:650;margin:19px 0 8px}.info-row{border-top:1px solid #edeee9;padding:12px 0;display:flex;justify-content:space-between;gap:15px}.info-row span{color:#92958c}.info-row b{font-size:12px;font-weight:540;color:#444b43;text-align:right}.notice{background:#f6f7f4;border:1px solid #ecede7;padding:13px;border-radius:10px;color:#7e8178;font-size:12px;line-height:1.6}.notice strong{color:#596d5e}.source-line{font-size:11px;color:#9b9d94;border-top:1px solid var(--line);padding:12px 0;margin-top:12px}
.map-pane{position:relative;min-width:0;background:#eeefec}.realmap,.fallbackmap{position:absolute;inset:0}.realmap{z-index:2}.fallbackmap{z-index:1;background:#ebedeb}.fallbackmap svg{width:100%;height:100%}.fallbackmap .sea{fill:#e0e3e2}.fallbackmap .land{fill:#f6f6f5;stroke:#d0d4cf;stroke-width:2}.fallbackmap .route{fill:none;stroke:#d5d8d3;stroke-width:1.1}.fallbackmap .fallbackplace{fill:#d9e7df;stroke:#4c7a68;stroke-width:2;cursor:pointer}.fallbackmap .fallbackplace.active{fill:#aecdb8;stroke:#1d5d44;stroke-width:4}.fallbackmap text{font-size:16px;fill:#7d8179;pointer-events:none}.fallbackmap .country{font-size:22px;fill:#5d635d}
.map-label{position:absolute;left:18px;top:18px;z-index:420;background:rgba(255,255,255,.96);border:1px solid #e9ebe6;box-shadow:var(--shadow);border-radius:11px;padding:10px 13px;color:#747a70;font-size:11px}.map-label strong{color:#40443e;font-size:12px}.map-actions{position:absolute;right:18px;bottom:25px;z-index:420;display:flex;flex-direction:column;gap:8px}.map-action{min-width:41px;height:41px;padding:0 12px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid #dedfd9;background:white;box-shadow:0 3px 16px rgba(0,0,0,.07);font-size:13px;color:#4c554d}.map-action:hover{background:#f7f9f7}.map-attribution{position:absolute;right:8px;bottom:2px;z-index:420;font-size:9px;color:#7d817b;background:rgba(255,255,255,.77);padding:2px 4px;border-radius:3px}.map-attribution a{text-decoration:none}.map-attribution a:hover{text-decoration:underline}.map-note{position:absolute;bottom:22px;left:18px;z-index:420;background:rgba(255,255,255,.92);border:1px solid #e7eae5;padding:8px 11px;border-radius:8px;font-size:10px;color:#8d918a;max-width:225px}
.leaflet-container{font:inherit;background:#eef0ed}.leaflet-control-attribution{font-size:9px!important}.leaflet-control-zoom{display:none}.leaflet-interactive:focus{outline:none}
.lightbox{position:fixed;inset:0;background:rgba(16,19,16,.96);display:none;z-index:1500;color:#fff;flex-direction:column;align-items:center;justify-content:center;padding:50px 65px 25px}.lightbox.open{display:flex}.lightbox-close{position:absolute;top:20px;right:24px;border:1px solid #56635b;border-radius:100%;background:rgba(255,255,255,.12);color:white;width:40px;height:40px;font-size:22px}.lightbox-stage{display:flex;align-items:center;justify-content:center;gap:14px;max-width:100%;min-height:0;flex:1}.lightbox-img{max-width:min(100%,1080px);max-height:calc(100dvh - 200px);object-fit:contain;min-width:0;box-shadow:0 16px 60px rgba(0,0,0,.2)}.lightbox-arrow{border:1px solid #556158;background:rgba(255,255,255,.1);color:white;border-radius:50%;width:43px;height:43px;flex:0 0 43px;font-size:24px}.lightbox-caption{text-align:center;padding-top:20px;max-width:900px;font-size:12px;color:#d2d8d1}.lightbox-caption strong{font-weight:550;color:#fff}.lightbox-caption a{color:#dceee2;text-decoration:underline;text-underline-offset:2px}.lightbox-strip{display:flex;gap:9px;justify-content:center;margin-top:15px}.lightbox-thumb{width:55px;height:41px;object-fit:cover;border-radius:5px;opacity:.55;border:2px solid transparent;cursor:pointer}.lightbox-thumb.active{opacity:1;border-color:#d4e8da}
@media(max-width:1200px){.app{grid-template-columns:290px 350px minmax(300px,1fr)}.results-panel{padding:20px 12px 12px}.place-main{padding:17px}.place-title{font-size:28px}.chip{padding:8px 9px;font-size:11px}}
@media(max-width:870px){.app{grid-template-columns:295px minmax(0,1fr)}.place-panel{position:absolute;left:295px;top:60px;bottom:20px;width:min(390px,calc(100vw - 315px));height:auto;z-index:500;box-shadow:var(--shadow);border-radius:15px;border:1px solid var(--line)}.place-panel.is-empty{display:none}.map-pane{grid-column:2}.lightbox{padding:52px 12px 25px}.lightbox-arrow{width:31px;height:31px;flex-basis:31px}.lightbox-img{max-height:calc(100dvh - 220px)}}
@media(max-width:600px){.app{display:block}.results-panel{position:absolute;top:10px;left:10px;width:calc(100vw - 20px);height:205px;z-index:500;border-radius:15px;padding:12px}.results-head{display:none}.section-head{display:none}.results-list{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;min-height:90px}.result{min-width:220px;max-width:220px;min-height:88px;align-items:flex-start}.result-photo{width:56px;flex-basis:56px;height:58px}.browse-footer{display:none}.map-pane{position:absolute;inset:0}.place-panel{position:absolute;left:10px;right:10px;bottom:10px;top:auto;width:auto;max-height:48dvh;border-radius:15px;overflow:auto}.hero{height:130px;min-height:130px}.place-main{padding:12px 15px}.place-title{font-size:24px}.tabbar{margin-top:12px}.map-label{top:228px;left:10px}.map-note{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="results-panel">
  <div class="results-head"><div><div class="product-label">Sooty Earth / Explore</div><div class="wordmark">Places<span style="color:#9eb0a4">.</span></div></div><button class="icon-button" id="reset" title="Reset map" aria-label="Reset map">⌖</button></div>
  <label class="searchbox"><span aria-hidden="true">⌕</span><input id="search" placeholder="Search places..." autocomplete="off"/><kbd>/</kbd></label>
  <div class="chips" role="group" aria-label="Place types">
    <button class="chip" data-type="protected" aria-pressed="true">Protected Areas</button><button class="chip" data-type="ecoregions" aria-pressed="false">Ecoregions</button><button class="chip" data-type="countries" aria-pressed="false">Countries</button>
  </div>

  <div class="results-list" id="results-list" aria-label="Place results"></div>

</aside>
<section class="place-panel" id="place-panel" aria-label="Selected Place"></section>
<main class="map-pane" aria-label="Map of Places">

      <text x="278" y="477" class="country">South Africa</text><text x="246" y="260" class="country">Botswana</text><text x="615" y="365" class="country" transform="rotate(60 615 365)">Mozambique</text><text x="200" y="576">Johannesburg</text><text x="370" y="493">Pretoria</text>
      <path class="fallbackplace" data-fallback-id="kgalagadi" d="M100 285L175 259L200 295L178 347L118 360L92 325Z"/>
      <path class="fallbackplace" data-fallback-id="kruger" d="M515 322L563 283L590 316L605 399L579 457L557 475L531 440L506 392Z"/>
      <path class="fallbackplace" data-fallback-id="makuleke" d="M530 330L562 298L580 326L569 351L540 359Z"/>

    </svg>
  </div>
  <div class="realmap" id="map"></div>
  <div class="map-label"><strong>South Africa</strong> <span style="color:#abb1a9">·</span> Places map</div>
  <div class="map-note">Boundary shapes are illustrative in this prototype, not WDPCA data.</div>
  <div class="map-actions"><button class="map-action" id="zoom-place" title="Zoom to selected Place">◎ Place</button><button class="map-action" id="zoom-home" title="Return to overview">⌂</button><button class="map-action" id="zoom-in" title="Zoom in">＋</button><button class="map-action" id="zoom-out" title="Zoom out">－</button></div>
  <div class="map-attribution" id="map-attribution">Map preview · no WDPCA boundary data</div>
</main>
</div>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Place photographs" tabindex="-1">
  <button class="lightbox-close" id="lightbox-close" aria-label="Close gallery">×</button>
  <div class="lightbox-stage"><button class="lightbox-arrow" id="lightbox-prev" aria-label="Previous photograph">‹</button><img class="lightbox-img" id="lightbox-img" alt=""/><button class="lightbox-arrow" id="lightbox-next" aria-label="Next photograph">›</button></div>
  <div class="lightbox-caption" id="lightbox-caption"></div><div class="lightbox-strip" id="lightbox-strip"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Static mock-up. This is NOT WDPCA boundary geometry or production data.
const galleryKruger = [
  {src:'https://upload.wikimedia.org/wikipedia/commons/9/94/Savanna_Grasslands_%28199168845%29.jpeg',title:'Savanna grasslands near Olifants Camp',creator:'Javier Puig Ochoa',license:'CC BY 3.0',licenseUrl:'https://creativecommons.org/licenses/by/3.0/',source:'https://commons.wikimedia.org/wiki/File:Savanna_Grasslands_(199168845).jpeg',note:'Display crop in hero view'},
  {src:'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c0/Kruger_National_Park_Landscape_3.jpg/1280px-Kruger_National_Park_Landscape_3.jpg',title:'Sabie River landscape, Kruger National Park',creator:'freestock.ca',license:'CC BY-SA 3.0',licenseUrl:'https://creativecommons.org/licenses/by-sa/3.0/',source:'https://commons.wikimedia.org/wiki/File:Kruger_National_Park_Landscape_3.jpg',note:'Display crop in hero view'},
  {src:'https://upload.wikimedia.org/wikipedia/commons/thumb/d/de/Kruger_National_Park_%28ZA%29%2C_Landschaft_--_2024_--_0031.jpg/1280px-Kruger_National_Park_%28ZA%29%2C_Landschaft_--_2024_--_0031.jpg',title:'Morning landscape in Kruger National Park',creator:'Dietmar Rabich',license:'CC BY-SA 4.0',licenseUrl:'https://creativecommons.org/licenses/by-sa/4.0/',source:'https://commons.wikimedia.org/wiki/File:Kruger_National_Park_(ZA),_Landschaft_--_2024_--_0031.jpg',note:'Display crop in hero view'}
];
const places = [
  {id:'kruger',type:'protected',name:'Kruger National Park',sub:'South Africa · National Park',designation:'National Park',country:'South Africa',area:'19,485',center:[-24.0,31.5],bounds:[[-25.5,30.9],[-22.4,32.15]],summary:'A large protected savanna landscape in northeastern South Africa, encompassing grasslands, woodlands and river systems. The map geometry in this prototype is schematic.',photos:galleryKruger,polygon:[[-22.40,31.03],[-22.65,31.22],[-23.06,31.18],[-23.54,31.35],[-24.10,31.40],[-24.63,31.53],[-25.50,31.55],[-25.46,32.10],[-24.82,31.95],[-24.31,31.91],[-23.48,31.81],[-22.90,31.68],[-22.40,31.53]]},
  {id:'makuleke',type:'protected',name:'Makuleke Contractual Park',sub:'South Africa · Contractual Park',designation:'Contractual Park',country:'South Africa',area:null,center:[-22.55,31.25],bounds:[[-22.72,31.06],[-22.36,31.47]],summary:'A distinct protected and historically significant area within the northern Kruger region. This prototype deliberately keeps overlapping Places available rather than automatically hiding them.',photos:[],polygon:[[-22.39,31.11],[-22.42,31.44],[-22.57,31.46],[-22.70,31.30],[-22.59,31.05]]},
  {id:'kgalagadi',type:'protected',name:'Kgalagadi Transfrontier Park',sub:'South Africa / Botswana · Transfrontier Park',designation:'Transfrontier Park',country:'South Africa / Botswana',area:'37,991',center:[-25.9,20.7],bounds:[[-27.2,19.4],[-24.7,21.9]],summary:'A transboundary Kalahari conservation area with extensive arid landscapes. The boundaries here are illustrative only.',photos:[],polygon:[[-24.8,19.45],[-25.10,20.2],[-24.95,21.4],[-25.45,21.9],[-27.10,21.5],[-27.06,20.0],[-26.21,19.4]]},
  {id:'isimangaliso',type:'protected',name:'iSimangaliso Wetland Park',sub:'South Africa · KwaZulu-Natal',designation:'Protected Area',country:'South Africa',area:null,center:[-27.7,32.55],bounds:[[-28.5,32.1],[-26.9,32.95]],summary:'A coastal protected landscape associated with wetlands, lakes and diverse habitats. The polygon is schematic.',photos:[],polygon:[[-26.9,32.5],[-27.55,32.6],[-28.44,32.84],[-28.20,32.42],[-27.52,32.12]]},
  {id:'savanna',type:'ecoregions',name:'Southern Africa bushveld',sub:'Illustrative ecoregion entry',designation:'Ecoregion',country:'Southern Africa',area:null,center:[-24.5,29.7],summary:'Ecoregion browsing uses this same detail-panel component.',photos:[]},
  {id:'grassland',type:'ecoregions',name:'Highveld grasslands',sub:'Illustrative ecoregion entry',designation:'Ecoregion',country:'Southern Africa',area:null,center:[-27,28],summary:'Ecoregion browsing uses this same detail-panel component.',photos:[]},
  {id:'southafrica',type:'countries',name:'South Africa',sub:'Country',designation:'Country',country:'Southern Africa',area:null,center:[-29,24],summary:'Country browsing uses the same search, selection and detail-panel pattern.',photos:[]},
  {id:'botswana',type:'countries',name:'Botswana',sub:'Country',designation:'Country',country:'Southern Africa',area:null,center:[-22.2,24.8],summary:'Country browsing uses the same search, selection and detail-panel pattern.',photos:[]},
  {id:'mozambique',type:'countries',name:'Mozambique',sub:'Country',designation:'Country',country:'Southern Africa',area:null,center:[-18.7,35],summary:'Country browsing uses the same search, selection and detail-panel pattern.',photos:[]}
];
let activeType='protected', selectedId='kruger', activeTab='overview', heroPhoto=0, lightboxIndex=0, map=null, shapes={}, mapReady=false, lastFocus=null;
const byId=id=>document.getElementById(id), getPlace=()=>places.find(p=>p.id===selectedId), allowed=()=>places.filter(p=>p.type===activeType);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderList(){
 const filter=byId('search').value.trim().toLowerCase();
 const found=allowed().filter(p=>[p.name,p.sub,p.designation,p.country].some(x=>(x||'').toLowerCase().includes(filter)));
 byId('list-heading').textContent={protected:'Protected Areas',ecoregions:'Ecoregions',countries:'Countries'}[activeType];
 byId('result-count').textContent=`${found.length} sample ${found.length===1?'result':'results'}`;
 byId('results-list').innerHTML=found.length?found.map(p=>`<button class="result ${p.id===selectedId?'selected':''}" data-place="${p.id}" aria-current="${p.id===selectedId?'true':'false'}"><div><div class="result-name">${esc(p.name)}</div><div class="result-meta">${esc(p.sub)}</div><div class="result-tags">${p.area?`<span class="quiet-tag">${p.area} km²</span>`:''}${p.photos.length?'<span class="quiet-tag">Photo gallery</span>':''}</div></div>${p.photos.length?`<img class="result-photo" src="${p.photos[0].src}" alt="" loading="lazy"/>`:'<div class="result-photo no-photo" aria-hidden="true">◇</div>'}</button>`).join(''):'<div class="notice">No matching Places in this small prototype sample.</div>';
 document.querySelectorAll('[data-place]').forEach(btn=>btn.addEventListener('click',()=>selectPlace(btn.dataset.place)));
}
function renderDetail(){
 const p=getPlace(),panel=byId('place-panel');
 if(!p){panel.className='place-panel is-empty';panel.innerHTML='<div class="empty-placeholder"><div class="leaf">◌</div><h2>Explore a Place</h2><p>Choose a Place from the results or the map.</p></div>';return;}
 panel.className='place-panel';
 const gallery=p.photos, photo=gallery[heroPhoto]||gallery[0];
 panel.innerHTML=`<div class="place-topline"><span>PLACE PROFILE · ${esc(p.country)}</span><button class="close-detail" id="close-detail" aria-label="Close Place details">×</button></div>
 <div class="hero">${photo?`<button class="hero-main" id="hero-open" title="Open full-screen photo gallery"><img class="hero-image" alt="${esc(photo.title)}" src="${photo.src}" onerror="this.style.display='none';this.parentNode.classList.add('photo-load-failed')"/><span class="hero-caption">Photo: ${esc(photo.creator)} · ${esc(photo.license)}</span><span class="gallery-hint">View gallery ↗</span></button><span class="hero-count">${heroPhoto+1} / ${gallery.length}</span>${gallery.length>1?'<button class="hero-arrows prev" id="hero-prev" aria-label="Previous photo">‹</button><button class="hero-arrows next" id="hero-next" aria-label="Next photo">›</button>':''}`:'<div class="photo-empty">No approved photo yet</div>'}</div>
 <div class="place-main"><div class="eyebrow">${esc(p.designation)} · ${esc(p.country)}</div><h1 class="place-title">${esc(p.name)}</h1><div class="subtitle">Sooty Earth · Place profile</div>
 ${p.area?`<div class="area-tag"><small>AREA</small>${esc(p.area)} km²</div>`:''}
 <div class="detail-actions"><button id="fit-selected" class="small-action primary">◎ Zoom to Place</button><button id="share-place" class="small-action">↗ Share</button></div>
 <div class="tabbar" role="tablist" aria-label="Place profile sections"><button role="tab" class="tab" data-tab="overview" aria-selected="${activeTab==='overview'}">Overview</button><button role="tab" class="tab" data-tab="disturbances" aria-selected="${activeTab==='disturbances'}">Disturbances</button><button role="tab" class="tab" data-tab="species" aria-selected="${activeTab==='species'}">Species</button></div>
 <div class="tab-content" role="tabpanel">${tabHtml(p)}</div></div>`;
 byId('close-detail').onclick=()=>{selectedId=null;heroPhoto=0;renderList();renderDetail();refreshMapSelection();};
 byId('fit-selected').onclick=()=>fitToSelected(true);
 byId('share-place').onclick=()=>{const t=`${p.name} · Sooty Earth (prototype)`;navigator.clipboard?.writeText(t).then(()=>{byId('share-place').textContent='✓ Copied';}).catch(()=>alert(t));};
 document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>{activeTab=el.dataset.tab;renderDetail()}));
 if(photo){byId('hero-open').onclick=()=>openLightbox(heroPhoto);if(gallery.length>1){byId('hero-prev').onclick=()=>moveHero(-1);byId('hero-next').onclick=()=>moveHero(1)}}
}
function tabHtml(p){
 if(activeTab==='overview')return `<p>${esc(p.summary)}</p><div class="section-label">Place details</div><div class="info-row"><span>Designation</span><b>${esc(p.designation)}</b></div><div class="info-row"><span>Location</span><b>${esc(p.country)}</b></div>${p.area?`<div class="info-row"><span>Area</span><b>${esc(p.area)} km²</b></div>`:''}<div class="source-line">Prototype values are illustrative. Live Place data must be read from Supabase and attributed to its source.</div>`;
 if(activeTab==='disturbances')return `<div class="section-label">Disturbances</div><p>Explore how the landscape has changed through mapped disturbances such as cropland, built-up areas and tree loss.</p><div class="notice"><strong>Data not available in this demo.</strong> The production panel should show existing, sourced disturbance Facts for the selected Place, or clearly state that no measurements are available.</div>`;
 return `<div class="section-label">Species</div><p>Discover species associated with this Place when verified species information is available.</p><div class="notice"><strong>No species data in this demo.</strong> Future summaries should distinguish verified records from incomplete coverage and never imply absence from missing observations.</div>`;
}
function moveHero(delta){const p=getPlace();heroPhoto=(heroPhoto+delta+p.photos.length)%p.photos.length;renderDetail();}
function selectPlace(id){
 const p=places.find(v=>v.id===id);if(!p)return;
 if(p.type!==activeType){activeType=p.type;document.querySelectorAll('[data-type]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.type===activeType)));}
 selectedId=id;activeTab='overview';heroPhoto=0;renderList();renderDetail();refreshMapSelection();maybeZoomToPlace(p);
}
function openLightbox(i){const p=getPlace();if(!p||!p.photos.length)return;lastFocus=document.activeElement;lightboxIndex=i;byId('lightbox').classList.add('open');document.body.style.overflow='hidden';renderLightbox();byId('lightbox-close').focus()}
function renderLightbox(){const p=getPlace();if(!p||!p.photos.length)return;const photo=p.photos[lightboxIndex];byId('lightbox-img').src=photo.src;byId('lightbox-img').alt=photo.title;
 byId('lightbox-caption').innerHTML=`<strong>${esc(photo.title)}</strong><br/>Photo: ${esc(photo.creator)} · <a href="${photo.source}" target="_blank" rel="noopener noreferrer">Wikimedia Commons source</a> · <a href="${photo.licenseUrl}" target="_blank" rel="noopener noreferrer">${esc(photo.license)}</a> · ${esc(photo.note)} · ${lightboxIndex+1} of ${p.photos.length}`;
 byId('lightbox-strip').innerHTML=p.photos.map((a,i)=>`<img class="lightbox-thumb ${i===lightboxIndex?'active':''}" src="${a.src}" data-photo="${i}" alt="Photograph ${i+1}" role="button" tabindex="0"/>`).join('');
 document.querySelectorAll('[data-photo]').forEach(el=>{el.onclick=()=>{lightboxIndex=+el.dataset.photo;renderLightbox();};el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click();}}});
}
function changeLightbox(d){const p=getPlace();if(!p)return;lightboxIndex=(lightboxIndex+d+p.photos.length)%p.photos.length;renderLightbox()}
function closeLightbox(){byId('lightbox').classList.remove('open');document.body.style.overflow='';lastFocus?.focus?.()}
byId('lightbox-close').onclick=closeLightbox;byId('lightbox-prev').onclick=()=>changeLightbox(-1);byId('lightbox-next').onclick=()=>changeLightbox(1);
byId('lightbox').addEventListener('click',e=>{if(e.target===byId('lightbox'))closeLightbox()});
document.addEventListener('keydown',e=>{if(byId('lightbox').classList.contains('open')){if(e.key==='Escape')closeLightbox();if(e.key==='ArrowLeft')changeLightbox(-1);if(e.key==='ArrowRight')changeLightbox(1);return;}if(e.key==='/'&&document.activeElement!==byId('search')){e.preventDefault();byId('search').focus();}if(e.key==='Escape'&&document.activeElement===byId('search'))byId('search').blur();});
byId('search').addEventListener('input',renderList);
document.querySelectorAll('[data-type]').forEach(b=>b.addEventListener('click',()=>{activeType=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));byId('search').value='';const p=getPlace();if(p&&p.type!==activeType){selectedId=null;heroPhoto=0;activeTab='overview';renderDetail();refreshMapSelection();}renderList();}));
byId('reset').onclick=()=>resetMap();byId('zoom-home').onclick=()=>resetMap();byId('zoom-place').onclick=()=>fitToSelected(true);byId('zoom-in').onclick=()=>mapReady?map.zoomIn():null;byId('zoom-out').onclick=()=>mapReady?map.zoomOut():null;
function resetMap(){if(mapReady)map.flyTo([-27.3,27.2],5,{duration:.8});}
function refreshMapSelection(){if(mapReady){Object.entries(shapes).forEach(([id,shape])=>shape.setStyle(id===selectedId?{color:'#245a48',weight:3.7,fillColor:'#568875',fillOpacity:.30}:{color:'#507d68',weight:1.6,fillColor:'#8ab49a',fillOpacity:.16}));if(selectedId&&shapes[selectedId])shapes[selectedId].bringToFront();}document.querySelectorAll('[data-fallback-id]').forEach(p=>p.classList.toggle('active',p.dataset.fallbackId===selectedId));}
function fitToSelected(force=false){const p=getPlace();if(!p)return;if(mapReady){if(p.bounds){map.fitBounds(p.bounds,{padding:[70,70],maxZoom:10,animate:true,duration:.8});}else{map.flyTo(p.center,6,{duration:.8})}}else{document.querySelector('.fallbackmap svg').style.transform=force?'scale(1.22)':'none';}}
function maybeZoomToPlace(p){if(!mapReady)return;if(p.bounds){const current=map.getBounds(),sw=p.bounds[0],ne=p.bounds[1];if(current.contains(sw)&&current.contains(ne))return;map.fitBounds(p.bounds,{padding:[65,65],maxZoom:9,animate:true,duration:.8});}else if(!map.getBounds().contains(p.center)){map.flyTo(p.center,6,{duration:.7})}}
function initMap(){if(typeof L==='undefined'){byId('map').style.display='none';return;}
 try{map=L.map('map',{center:[-27.3,27.2],zoom:5,zoomControl:false,scrollWheelZoom:true,attributionControl:true});
 L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap contributors &copy; CARTO',maxZoom:18,subdomains:'abcd'}).addTo(map);
 places.filter(p=>p.polygon).forEach(p=>{const obj=L.polygon(p.polygon,{color:'#507d68',weight:1.6,fillColor:'#8ab49a',fillOpacity:.16,interactive:true}).addTo(map);obj.bindTooltip(p.name,{direction:'top',sticky:true});obj.on('click',()=>selectPlace(p.id));shapes[p.id]=obj;});
 mapReady=true;byId('fallbackmap').style.display='none';byId('map-attribution').style.display='none';refreshMapSelection();setTimeout(()=>map.invalidateSize(),100);
 }catch(error){byId('map').style.display='none';console.warn('Map preview unavailable, using SVG fallback',error);}}
document.querySelectorAll('[data-fallback-id]').forEach(el=>el.addEventListener('click',()=>selectPlace(el.dataset.fallbackId)));
renderList();renderDetail();refreshMapSelection();initMap();
</script>
</body>
</html>
